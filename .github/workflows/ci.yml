name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate compose
        run: docker compose config
      - name: Start Neo4j
        run: |
          docker compose up -d neo4j
          for i in {1..60}; do
            if docker compose exec -T neo4j cypher-shell -u neo4j -p trident-password "RETURN 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs neo4j
          exit 1
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
