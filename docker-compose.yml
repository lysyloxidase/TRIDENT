services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/trident-password
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p trident-password 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: trident-password
      TRIDENT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: ["uvicorn", "trident.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: trident-password
      TRIDENT_REDIS_URL: redis://redis:6379/0
    command:
      ["celery", "-A", "trident.worker.celery_app", "worker", "--loglevel=info", "--uid=nobody"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_TRIDENT_API_URL: http://api:8000
      NEXT_PUBLIC_TRIDENT_WS_URL: ws://api:8000/ws
    ports:
      - "3000:3000"

  gpu-worker:
    build: .
    profiles: ["gpu"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      TRIDENT_REDIS_URL: redis://redis:6379/0
      TRIDENT_GPU: "1"
      NVIDIA_VISIBLE_DEVICES: all
    command:
      [
        "celery",
        "-A",
        "trident.worker.celery_app",
        "worker",
        "--loglevel=info",
        "--uid=nobody",
        "-Q",
        "gpu",
      ]

volumes:
  neo4j-data:
  neo4j-logs:
