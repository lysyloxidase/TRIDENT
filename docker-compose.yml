services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/trident-password
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p trident-password 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: trident-password
    command: ["python", "-m", "trident.kg.build_graph", "--limit", "10"]
    profiles: ["app"]

volumes:
  neo4j-data:
  neo4j-logs:
