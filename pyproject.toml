[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trident-discovery"
version = "1.0.0"
description = "TRIDENT: multi-agent neglected-target discovery and drug design platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TRIDENT contributors" }]
dependencies = [
  "celery>=5.4",
  "fastapi>=0.115",
  "httpx>=0.27",
  "neo4j>=5.20",
  "pandas>=2.2",
  "pydantic>=2.7",
  "redis>=5.0",
  "eval-type-backport>=0.2.2; python_version < '3.10'",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
  "lxml>=5.2",
]

[project.optional-dependencies]
agents = [
  "langgraph>=0.2",
  "litellm>=1.60",
]
dev = [
  "coverage>=7.10",
  "pyright>=1.1",
  "pytest>=8.2",
  "pytest-cov>=7.1",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
trident = "trident.cli:main"
trident-build-kg = "trident.kg.build_graph:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trident"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["trident"]
strict = false
warn_unused_ignores = true
